services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      Client__BaseUrl: ${PUBLIC_ORIGIN:-http://localhost}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Identity__AdminEmails__0: ${ADMIN_EMAIL:-}
      DataProtection__KeysPath: /app/data-protection
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromAddress: ${RESEND_FROM_ADDRESS:-noreply@pickandroll.io}
      Resend__FromName: Pick & Roll
    expose:
      - "8080"
    volumes:
      - data-protection:/app/data-protection

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Host Nginx terminates HTTPS and proxies to this private port.
      - "127.0.0.1:8080:80"

volumes:
  data-protection:
