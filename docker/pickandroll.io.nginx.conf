# Install on the Droplet as:
#   /etc/nginx/sites-available/pickandroll.io
# The Let's Encrypt certificate must exist before installing this production file.

server {
    listen 80;
    listen [::]:80;
    server_name pickandroll.io www.pickandroll.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pickandroll.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pickandroll.io;

    ssl_certificate /etc/letsencrypt/live/pickandroll.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pickandroll.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PickAndRollTLS:10m;
    ssl_session_tickets off;

    return 301 https://pickandroll.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pickandroll.io;

    ssl_certificate /etc/letsencrypt/live/pickandroll.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pickandroll.io/privkey.pem;
    # Keep TLS settings self-contained. Certbot creates options-ssl-nginx.conf
    # and ssl-dhparams.pem only for some installation methods.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PickAndRollTLS:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
