map $http_x_forwarded_proto $pickandroll_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Unknown direct URLs load Angular's branded not-found route while retaining
    # the correct HTTP 404 status for crawlers and monitoring.
    error_page 404 /index.html;

    location /api/ {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;

		proxy_connect_timeout 30s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Preserve HTTPS from the host Nginx. This value is used by ASP.NET Core
		# to build the Google OAuth callback URI behind both proxy layers.
		proxy_set_header X-Forwarded-Proto $pickandroll_forwarded_proto;
		proxy_set_header X-Forwarded-Host $host;
	}

    location = /grid {
        return 301 /grid/normal;
    }

    # These are Angular-only routes and intentionally are not emitted as SEO
    # pages. Direct navigation, OAuth redirects and browser refreshes still need
    # the SPA entry point. Keep the general fallback below as a real 404.
    location ~ ^/(?:auth/callback|login|register|forgot-password|resend-confirmation|reset-password|set-password|change-temporary-password|confirm-email|profile|leaderboard|admin/users|game/history|play/[^/]+)/?$ {
        try_files $uri /index.html;
    }

    location / {
        # All public Angular routes have index.html files generated by npm's postbuild.
        # Unknown URLs must return 404 rather than an indexable copy of the home page.
        try_files $uri/index.html $uri $uri/ =404;
    }
}
